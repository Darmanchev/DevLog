services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in Coolify}
      DEBUG: "False"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private PostgreSQL resource URL}
      DB_CONN_MAX_AGE: "60"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      COOLIFY_FQDN: ${SERVICE_FQDN_NGINX}
      COOLIFY_URL: ${SERVICE_URL_NGINX}
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      SECURE_SSL_REDIRECT: "False"
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
      SECURE_HSTS_PRELOAD: "False"
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_URL_NGINX
    volumes:
      - media_data:/var/www/media:ro
    expose:
      - "80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  media_data:
